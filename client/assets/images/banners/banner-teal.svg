<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="100%" height="100%" fill="#134E5E"/>
  <!-- Grand Edge-to-Edge Isometric Geometric Facets & Triangular Planes -->
  <g stroke="#FFFFFF" opacity="0.20" stroke-width="2.2" fill="none">
    <!-- Grand Left-to-Center Facet Lattice (anchored off left and bottom edges) -->
    <polygon points="-50,0 250,150 100,450 -100,320" stroke-width="2.5" />
    <polygon points="250,150 550,0 420,320 100,450" stroke-dasharray="10 8" />
    <polygon points="100,450 420,320 300,675 -50,675" />
    <polygon points="420,320 680,200 600,560 300,675" stroke-width="2.5" />

    <!-- Grand Right Facet Lattice (anchored off top and right edges) -->
    <polygon points="550,0 880,120 680,200 420,320" stroke-dasharray="8 6" />
    <polygon points="880,120 1250,0 1250,280 960,380" stroke-width="2.5" />
    <polygon points="680,200 960,380 840,675 600,560" />
    <polygon points="960,380 1250,280 1250,675 840,675" stroke-dasharray="10 8" />
  </g>
  <!-- Full-width intersecting isometric diagonal guide wires -->
  <g stroke="#71B1C8" opacity="0.22" stroke-width="1.8" stroke-dasharray="6 6" fill="none">
    <line x1="-50" y1="150" x2="1250" y2="520" />
    <line x1="-50" y1="520" x2="1250" y2="150" />
    <circle cx="420" cy="320" r="5" fill="#71B1C8" />
    <circle cx="680" cy="200" r="4.5" fill="#71B1C8" />
    <circle cx="960" cy="380" r="5" fill="#71B1C8" />
    <circle cx="600" cy="560" r="4.5" fill="#71B1C8" />
  </g>
</svg>
