<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- Grand Concentric Circular Ripple Arcs Expanding Edge-to-Edge -->
  <g stroke="#FFFFFF" opacity="0.22" stroke-width="2.2" fill="none">
    <!-- Bottom Left Ripple Origin (anchored off corner) -->
    <circle cx="80" cy="620" r="140" />
    <circle cx="80" cy="620" r="240" stroke-dasharray="10 8" />
    <circle cx="80" cy="620" r="360" />
    <circle cx="80" cy="620" r="500" stroke-dasharray="8 6" stroke-width="1.8" />
    <circle cx="80" cy="620" r="660" stroke-width="2.5" />
    <circle cx="80" cy="620" r="840" stroke-dasharray="12 10" stroke-width="1.8" />
    <circle cx="80" cy="620" r="1040" stroke-width="2.2" />

    <!-- Top Right Counter Ripple Origin (anchored off corner) -->
    <circle cx="1120" cy="60" r="110" />
    <circle cx="1120" cy="60" r="210" stroke-dasharray="8 6" />
    <circle cx="1120" cy="60" r="320" />
    <circle cx="1120" cy="60" r="460" stroke-dasharray="10 8" stroke-width="1.8" />
    <circle cx="1120" cy="60" r="620" stroke-width="2.2" />
    <circle cx="1120" cy="60" r="800" stroke-dasharray="12 12" stroke-width="1.6" />
  </g>
  <!-- Graceful organic contour bridge curves -->
  <g stroke="#FFFFFF" opacity="0.16" stroke-width="1.8" fill="none">
    <path d="M460 675 C600 500, 680 320, 620 0" stroke-dasharray="8 8" />
    <path d="M540 675 C680 540, 760 360, 700 0" />
    <circle cx="80" cy="620" r="7" fill="#FFFFFF" opacity="0.3" />
    <circle cx="1120" cy="60" r="7" fill="#FFFFFF" opacity="0.3" />
  </g>
</svg>
