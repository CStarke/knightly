<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- Collegiate Diagonal Pinstripes & Scaffolding Rails (100% Mathematically Parallel 45° Lines) -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Band 1: Upper-Left Corner Accent Rails (x + y = 200, 230, 260) -->
    <line x1="-625" y1="825" x2="350" y2="-150" stroke-width="2.2" opacity="0.18" />
    <line x1="-595" y1="825" x2="380" y2="-150" stroke-width="1.5" opacity="0.16" />
    <line x1="-565" y1="825" x2="410" y2="-150" stroke-width="1.8" stroke-dasharray="10 8" opacity="0.18" />

    <!-- Band 2: Mid-Left Field Multi-Track Pinstripe Cluster (x + y = 540, 565, 590, 620, 650) -->
    <line x1="-285" y1="825" x2="690" y2="-150" stroke-width="2.6" opacity="0.25" />
    <line x1="-260" y1="825" x2="715" y2="-150" stroke-width="1.5" opacity="0.20" />
    <line x1="-235" y1="825" x2="740" y2="-150" stroke-width="1.5" opacity="0.20" />
    <line x1="-205" y1="825" x2="770" y2="-150" stroke-width="2.0" stroke-dasharray="12 8" opacity="0.22" />
    <line x1="-175" y1="825" x2="800" y2="-150" stroke-width="2.4" opacity="0.24" />

    <!-- Band 3: Grand Central Field Varsity Multi-Rail Band (x + y = 900..1085) -->
    <line x1="75" y1="825" x2="1050" y2="-150" stroke-width="2.8" opacity="0.26" />
    <line x1="100" y1="825" x2="1075" y2="-150" stroke-width="1.6" opacity="0.20" />
    <line x1="125" y1="825" x2="1100" y2="-150" stroke-width="1.6" opacity="0.20" />
    <line x1="155" y1="825" x2="1130" y2="-150" stroke-width="2.2" stroke-dasharray="14 10" opacity="0.24" />
    <line x1="185" y1="825" x2="1160" y2="-150" stroke-width="2.6" opacity="0.25" />
    <line x1="210" y1="825" x2="1185" y2="-150" stroke-width="1.6" opacity="0.20" />
    <line x1="235" y1="825" x2="1210" y2="-150" stroke-width="1.6" opacity="0.20" />
    <line x1="260" y1="825" x2="1235" y2="-150" stroke-width="2.6" opacity="0.25" />

    <!-- Band 4: Mid-Right Field Diagonal Band (x + y = 1300..1415) -->
    <line x1="475" y1="825" x2="1450" y2="-150" stroke-width="2.6" opacity="0.25" />
    <line x1="505" y1="825" x2="1480" y2="-150" stroke-width="2.0" stroke-dasharray="12 8" opacity="0.22" />
    <line x1="535" y1="825" x2="1510" y2="-150" stroke-width="1.5" opacity="0.20" />
    <line x1="560" y1="825" x2="1535" y2="-150" stroke-width="1.5" opacity="0.20" />
    <line x1="590" y1="825" x2="1565" y2="-150" stroke-width="2.4" opacity="0.24" />

    <!-- Band 5: Lower-Right Corner Accent Rails (x + y = 1660, 1690, 1720) -->
    <line x1="835" y1="825" x2="1810" y2="-150" stroke-width="2.2" opacity="0.18" />
    <line x1="865" y1="825" x2="1840" y2="-150" stroke-width="1.8" stroke-dasharray="10 8" opacity="0.18" />
    <line x1="895" y1="825" x2="1870" y2="-150" stroke-width="1.5" opacity="0.16" />
  </g>

  <!-- Accent Nodes Centered Precisely on Stripes -->
  <g fill="#FFFFFF" opacity="0.28">
    <circle cx="240" cy="350" r="4.5" />
    <circle cx="500" cy="450" r="4.5" />
    <circle cx="750" cy="200" r="4.5" />
    <circle cx="700" cy="335" r="4.0" />
    <circle cx="900" cy="460" r="4.0" />
