<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="100%" height="100%" fill="#B84A28"/>
  <!-- Grand Edge-to-Edge Horizon Waves & Flowing Contours -->
  <g stroke="#FFFFFF" opacity="0.22" stroke-width="2.5" fill="none">
    <path d="M-80 80 C260 0, 480 200, 780 100 C980 40, 1120 180, 1280 120" />
    <path d="M-80 180 C260 100, 480 300, 780 200 C980 140, 1120 280, 1280 220" stroke-width="1.8" stroke-dasharray="10 8" />
    <path d="M-80 280 C260 200, 480 400, 780 300 C980 240, 1120 380, 1280 320" stroke-width="2.8" />
    <path d="M-80 380 C260 300, 480 500, 780 400 C980 340, 1120 480, 1280 420" stroke-width="1.8" stroke-dasharray="14 8" />
    <path d="M-80 480 C260 400, 480 600, 780 500 C980 440, 1120 580, 1280 520" stroke-width="2.5" />
    <path d="M-80 580 C260 500, 480 700, 780 600 C980 540, 1120 680, 1280 620" stroke-width="1.8" stroke-dasharray="8 8" />
  </g>
  <!-- Accent counter-wave sweeping across the lower edge -->
  <g stroke="#F3CD00" opacity="0.20" stroke-width="2.2" fill="none">
    <path d="M-80 420 C180 560, 580 320, 880 500 C1080 600, 1180 440, 1280 520" />
  </g>
</svg>
