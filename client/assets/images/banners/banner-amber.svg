<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="100%" height="100%" fill="#A06818"/>
  <!-- Grand Radial Rays & Arcs Anchored Off Top-Left & Bottom-Right -->
  <!-- Top-Left Origin Grand Concentric Arcs -->
  <g stroke="#FFFFFF" opacity="0.22" stroke-width="2.2" fill="none">
    <circle cx="-60" cy="-60" r="280" />
    <circle cx="-60" cy="-60" r="440" stroke-dasharray="10 8" />
    <circle cx="-60" cy="-60" r="620" />
    <circle cx="-60" cy="-60" r="820" stroke-dasharray="14 10" stroke-width="1.8" />
    <circle cx="-60" cy="-60" r="1050" stroke-width="2.5" />
    <circle cx="-60" cy="-60" r="1300" stroke-dasharray="8 8" stroke-width="1.8" />
  </g>
  <!-- Bottom-Right Origin Counter Arcs -->
  <g stroke="#FFFFFF" opacity="0.18" stroke-width="2" fill="none">
    <circle cx="1260" cy="735" r="220" />
    <circle cx="1260" cy="735" r="380" stroke-dasharray="8 8" />
    <circle cx="1260" cy="735" r="560" stroke-width="1.6" />
    <circle cx="1260" cy="735" r="760" stroke-dasharray="12 10" stroke-width="1.6" />
  </g>
  <!-- Sweeping Radial Beam Lines fanning from Top-Left corner across entire screen -->
  <g stroke="#FFFFFF" opacity="0.16" stroke-width="1.8" stroke-linecap="round" fill="none">
    <line x1="-60" y1="-60" x2="1200" y2="280" />
    <line x1="-60" y1="-60" x2="900" y2="675" stroke-dasharray="10 8" />
    <line x1="-60" y1="-60" x2="520" y2="675" />
    <line x1="-60" y1="-60" x2="1200" y2="540" stroke-dasharray="6 6" />
  </g>
  <!-- Accent sunburst sparkle points along outer arcs -->
  <g fill="#FFFFFF" opacity="0.28">
    <circle cx="560" cy="300" r="4.5" />
    <circle cx="820" cy="480" r="4" />
    <circle cx="380" cy="460" r="4" />
    <circle cx="980" cy="180" r="3.5" />
  </g>
</svg>
