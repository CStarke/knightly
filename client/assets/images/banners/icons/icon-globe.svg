<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer Globe Horizon Limb -->
  <circle cx="12" cy="12" r="9.5" />

  <!-- Equator Line -->
  <line x1="2.5" y1="12" x2="21.5" y2="12" />

  <!-- Central Prime Meridian -->
  <line x1="12" y1="2.5" x2="12" y2="21.5" />

  <!-- Symmetrical Longitude Meridian Ellipse -->
  <ellipse cx="12" cy="12" rx="4.8" ry="9.5" />

  <!-- Latitude Parallels (Northern & Southern Hemispheres) -->
  <path d="M 4 7 C 7.5 9 16.5 9 20 7" />
  <path d="M 4 17 C 7.5 15 16.5 15 20 17" />
</svg>
