<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="100%" height="100%" fill="#204B6E"/>
  <!-- Grand Edge-Anchored 6-Axis Crystalline Snowflakes -->
  <!-- Major Snowflake 1 (Anchored Off Left Edge) -->
  <g transform="translate(60, 340)" stroke="#FFFFFF" opacity="0.25" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- 6 main axes extending 320px across the canvas -->
    <line x1="0" y1="-320" x2="0" y2="320" stroke-width="3" />
    <line x1="-277" y1="-160" x2="277" y2="160" stroke-width="3" />
    <line x1="-277" y1="160" x2="277" y2="-160" stroke-width="3" />
    <!-- Outer concentric hexagonal crystal ring -->
    <polygon points="0,-160 138.5,-80 138.5,80 0,160 -138.5,80 -138.5,-80" stroke-width="2" stroke-dasharray="10 8" />
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" stroke-width="1.8" />
    <!-- Chevrons / crystalline branch arms -->
    <path d="M-60 -210 L0 -150 L60 -210" />
    <path d="M-60 210 L0 150 L60 210" />
    <path d="M-210 -60 L-150 0 L-210 60" />
    <path d="M210 -60 L150 0 L210 60" />
    <path d="M120 180 L180 150 L210 210" />
    <path d="M120 -180 L180 -150 L210 -210" />
    <!-- Tip crystal nodes -->
    <circle cx="277" cy="160" r="5" fill="#FFFFFF" />
    <circle cx="277" cy="-160" r="5" fill="#FFFFFF" />
    <circle cx="0" cy="-320" r="5" fill="#FFFFFF" />
    <circle cx="0" cy="320" r="5" fill="#FFFFFF" />
  </g>

  <!-- Major Snowflake 2 (Anchored Off Top-Right Corner) -->
  <g transform="translate(1140, 80)" stroke="#FFFFFF" opacity="0.22" stroke-width="2.2" stroke-linecap="round" fill="none">
    <line x1="0" y1="-260" x2="0" y2="260" stroke-width="2.8" />
    <line x1="-225" y1="-130" x2="225" y2="130" stroke-width="2.8" />
    <line x1="-225" y1="130" x2="225" y2="-130" stroke-width="2.8" />
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" stroke-dasharray="8 6" />
    <path d="M-45 -160 L0 -115 L45 -160" />
    <path d="M-45 160 L0 115 L45 160" />
    <path d="M-160 -45 L-115 0 L-160 45" />
    <circle cx="-225" cy="130" r="4.5" fill="#FFFFFF" />
    <circle cx="-225" cy="-130" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Fine connective diagonal crystal ray -->
  <g stroke="#FFFFFF" opacity="0.15" stroke-width="1.8" stroke-dasharray="6 8" fill="none">
    <line x1="337" y1="180" x2="915" y2="210" />
    <line x1="60" y1="340" x2="800" y2="675" />
    <circle cx="626" cy="195" r="4" fill="#FFFFFF" />
    <circle cx="430" cy="507" r="4" fill="#FFFFFF" />
  </g>
</svg>
