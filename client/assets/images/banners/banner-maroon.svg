<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="100%" height="100%" fill="#5E1A24"/>
  <!-- Grand Edge-to-Edge 33° Calvin Scaffolding Geometry -->
  <g stroke="#E8B019" opacity="0.22" stroke-width="2.5" fill="none">
    <!-- Edge-to-edge diagonal rails sweeping across the entire canvas -->
    <line x1="-300" y1="850" x2="950" y2="-100" />
    <line x1="-120" y1="850" x2="1130" y2="-100" />
    <line x1="60" y1="850" x2="1310" y2="-100" />
    <line x1="240" y1="850" x2="1490" y2="-100" stroke-dasharray="10 8" />
    <line x1="-480" y1="850" x2="770" y2="-100" stroke-dasharray="14 10" stroke-width="1.8" />
  </g>
  <!-- Full-width cross-accent horizon rails -->
  <g stroke="#FFFFFF" opacity="0.12" stroke-width="1.8" fill="none">
    <line x1="-50" y1="140" x2="1250" y2="140" />
    <line x1="-50" y1="535" x2="1250" y2="535" stroke-dasharray="8 8" />
  </g>
  <!-- Grand Scaled Diamond Rhombus Frames -->
  <g stroke="#E8B019" opacity="0.26" stroke-width="2.6" fill="none">
    <!-- Anchored off bottom-left edge (Large 340px Diamond) -->
    <rect x="-70" y="400" width="340" height="340" transform="rotate(33 100 570)" stroke-width="2.8" />
    <rect x="-15" y="455" width="230" height="230" transform="rotate(33 100 570)" stroke-dasharray="8 6" stroke-width="2" />
    <rect x="35" y="505" width="130" height="130" transform="rotate(33 100 570)" stroke-width="1.6" />
    <circle cx="100" cy="570" r="5" fill="#E8B019" />

    <!-- Anchored off top-right edge (Large 300px Diamond) -->
    <rect x="970" y="-60" width="300" height="300" transform="rotate(33 1120 90)" stroke-width="2.8" />
    <rect x="1020" y="-10" width="200" height="200" transform="rotate(33 1120 90)" stroke-dasharray="8 6" stroke-width="2" />
    <rect x="1065" y="35" width="110" height="110" transform="rotate(33 1120 90)" stroke-width="1.6" />
    <circle cx="1120" cy="90" r="5" fill="#E8B019" />

    <!-- Center Field Focal Node (Enlarged 180px Diamond) -->
    <rect x="520" y="210" width="180" height="180" transform="rotate(33 610 300)" stroke-width="2.5" />
    <rect x="560" y="250" width="100" height="100" transform="rotate(33 610 300)" stroke-dasharray="6 6" stroke-width="1.8" />
    <circle cx="610" cy="300" r="4.5" fill="#E8B019" />
  </g>
</svg>
